# SonarCloud analysis — requires repo secret SONAR_TOKEN
# Create project in SonarCloud first; match sonar.organization / sonar.projectKey
# in sonar-project.properties. See docs/QUALITY.md.

name: SonarCloud

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      # Pin exact versions (S8544). Avoid `--only-binary :all:` spaced form
      # (Sonar parser historically treated `:all:` as an unpinned package).
      - name: Install deps (dev/test + charting)
        run: |
          python -m pip install --upgrade pip==25.0.1
          python -m pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml tests/

      - name: Require SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Falta el secreto SONAR_TOKEN. Crea el proyecto en SonarCloud y añade el token en GitHub → Settings → Secrets and variables → Actions. Ver docs/QUALITY.md."
            exit 1
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
