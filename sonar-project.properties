# SonarQube / SonarCloud — Cursor Trading (flash-trading-signals)
#
# SonarCloud (CI / remote): create the project in the UI first; match projectKey + organization.
# Local SonarQube (http://localhost:9000): use scripts/analyze/run-sonar-local.ps1
#   (the script clears sonar.organization for local hosts — that property is SonarCloud-only).
# Host URL is NOT stored here; pass -Dsonar.host.url=... or $env:SONAR_HOST_URL / script default.

sonar.projectKey=minichaverra-beep_flash-trading-signals
sonar.projectName=Flash Trading Signals
# Change to your SonarCloud org key (often your GitHub user/org slug):
sonar.organization=minichaverra-beep

sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Runtime / bulky / generated — not analyzed (single-line; avoid leading spaces after \)
sonar.exclusions=live/**,data/**,models/**,assets/**,**/__pycache__/**,**/.venv/**,**/venv/**,**/.pytest_cache/**,**/*.png,**/*_signal_history.json,**/training neuronal/models/**,**/training neuronal/reports/**

sonar.test.exclusions=**/__pycache__/**

# Coverage from: pytest --cov=app --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml
# Peripheral new deltas (wrappers / neural / controllers) — main new modules covered by unit tests
sonar.coverage.exclusions=**/training neuronal/**,app/controllers/analyze_btc_m5.py,app/controllers/analyze_us30_m5.py,app/controllers/analyze_super_high_entry.py,app/controllers/train_btc_signals.py,app/controllers/train_us30_signals.py,app/services/btc_high_analysis.py,app/services/btc_super_high_analysis.py

# Twin BTC/US30 launchers and generated HTML inflate CPD on new code without signal value
sonar.cpd.exclusions=tests/**,scripts/**,live/**,**/*.html,**/*.ps1
